<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FBF6EE" />
<title>四六级备考台</title>
<style>
  :root{
    --bg:#FBF6EE;          /* 暖白底 */
    --surface:#FFFFFF;
    --surface-2:#FDF3E7;
    --ink:#22304E;         /* 深墨蓝 */
    --ink-soft:#5B6A86;
    --orange:#F0922B;      /* 晨曦橙 */
    --orange-2:#FFB877;
    --orange-soft:#FCEBD6;
    --green:#2E9E5B;       /* 正确绿 */
    --red:#E0492F;         /* 逾期红 */
    --amber:#E8A33D;
    --border:#ECE0CE;
    --border-2:#F3E8D7;
    --shadow:0 8px 24px rgba(34,48,78,.08);
    --shadow-sm:0 3px 10px rgba(34,48,78,.06);
    --radius:16px;
    --radius-sm:11px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    font-size:15px;
    line-height:1.5;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink);}
  a{color:var(--orange);}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:9px;}

  /* ===== App shell ===== */
  .app{display:flex;min-height:100vh;}
  .sidebar{
    width:236px;flex:0 0 236px;background:var(--surface);
    border-right:1px solid var(--border);
    display:flex;flex-direction:column;padding:18px 14px;position:sticky;top:0;height:100vh;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px;font-weight:800;font-size:18px;color:var(--ink);}
  .brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--orange),var(--orange-2));display:flex;align-items:center;justify-content:center;color:#fff;}
  .side-nav{display:flex;flex-direction:column;gap:6px;flex:1;}
  .nav-item{
    display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:12px;
    color:var(--ink-soft);font-weight:600;font-size:15px;transition:.18s;width:100%;text-align:left;
  }
  .nav-item svg{width:20px;height:20px;flex:0 0 20px;}
  .nav-item:hover{background:var(--surface-2);color:var(--ink);}
  .nav-item.active{background:linear-gradient(135deg,var(--orange),var(--orange-2));color:#fff;box-shadow:var(--shadow-sm);}
  .side-foot{font-size:12px;color:var(--ink-soft);padding:10px 8px 0;border-top:1px solid var(--border-2);margin-top:8px;}

  .topnav{display:none;}
  .bottom-nav{display:none;}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .content{padding:22px 26px 40px;max-width:1180px;width:100%;margin:0 auto;}
  .page-head{margin-bottom:18px;}
  .page-title{font-size:23px;font-weight:800;margin:0 0 4px;}
  .page-sub{color:var(--ink-soft);font-size:13.5px;margin:0;}

  /* ===== cards ===== */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow-sm);}
  .card + .card{margin-top:16px;}
  .grid{display:grid;gap:16px;}
  .g2{grid-template-columns:repeat(2,1fr);}
  .g3{grid-template-columns:repeat(3,1fr);}
  .g4{grid-template-columns:repeat(4,1fr);}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;}
  .stat .label{font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;}
  .stat .num{font-size:26px;font-weight:800;color:var(--ink);line-height:1.1;}
  .stat .num small{font-size:14px;font-weight:600;color:var(--ink-soft);}
  .stat.accent .num{color:var(--orange);}
  .stat.green .num{color:var(--green);}
  .stat.red .num{color:var(--red);}

  /* today handle bar */
  .handle{background:linear-gradient(135deg,#FFF4E6,#FDEAD2);border:1px solid var(--orange-soft);border-radius:var(--radius);padding:16px 18px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;}
  .handle .h-title{font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px;}
  .handle .h-item{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:600;}
  .handle .h-item b{color:var(--orange);}
  .handle .h-item.warn b{color:var(--red);}

  /* buttons */
  .btn{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:11px;font-weight:700;font-size:14px;background:var(--surface-2);color:var(--ink);border:1px solid var(--border);transition:.15s;}
  .btn:hover{background:var(--surface);}
  .btn svg{width:17px;height:17px;}
  .btn-primary{background:linear-gradient(135deg,var(--orange),var(--orange-2));color:#fff;border:none;box-shadow:var(--shadow-sm);}
  .btn-primary:hover{filter:brightness(1.04);}
  .btn-green{background:var(--green);color:#fff;border:none;}
  .btn-red{background:var(--red);color:#fff;border:none;}
  .btn-ghost{background:transparent;}
  .btn-sm{padding:6px 11px;font-size:13px;border-radius:9px;}
  .btn[disabled]{opacity:.45;cursor:not-allowed;}
  .btn-block{width:100%;justify-content:center;}

  /* forms */
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;}
  .input,.select,.textarea{
    width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);
    transition:.15s;outline:none;
  }
  .input:focus,.select:focus,.textarea:focus{border-color:var(--orange);box-shadow:0 0 0 3px var(--orange-soft);}
  .textarea{resize:vertical;min-height:64px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .row > *{flex:1;min-width:120px;}

  /* section title */
  .sec-title{font-size:15.5px;font-weight:800;margin:4px 0 12px;display:flex;align-items:center;gap:8px;}
  .sec-title svg{width:18px;height:18px;color:var(--orange);}

  /* ring */
  .ring-wrap{display:flex;align-items:center;gap:16px;}
  .ring{width:120px;height:120px;flex:0 0 120px;}
  .ring-bg{fill:none;stroke:var(--border-2);stroke-width:11;}
  .ring-fg{fill:none;stroke:var(--orange);stroke-width:11;stroke-linecap:round;transition:stroke-dashoffset .6s;}
  .ring-center{font-weight:800;font-size:20px;}

  /* heatmap */
  .heatmap{display:grid;grid-template-columns:repeat(15,1fr);gap:5px;}
  .hm-cell{aspect-ratio:1;border-radius:4px;background:var(--border-2);}
  .hm-cell.lvl1{background:#FCE3C4;}
  .hm-cell.lvl2{background:#F9C289;}
  .hm-cell.lvl3{background:#F4A24E;}
  .hm-cell.lvl4{background:var(--orange);}
  .hm-legend{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft);margin-top:10px;}

  /* line chart */
  .chart-box{width:100%;overflow-x:auto;}
  .chart{width:680px;max-width:100%;height:auto;display:block;}

  /* list items */
  .li{display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--border);border-radius:12px;background:var(--surface);}
  .li + .li{margin-top:10px;}
  .li.due{border-color:var(--red);background:#FFF5F2;}
  .li .li-main{flex:1;min-width:0;}
  .li .li-t{font-weight:700;font-size:14.5px;}
  .li .li-d{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .tag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--orange-soft);color:var(--orange);}
  .tag.green{background:#E2F5EA;color:var(--green);}
  .tag.red{background:#FBE3DD;color:var(--red);}
  .tag.ink{background:#E7ECF5;color:var(--ink);}
  .li-actions{display:flex;gap:6px;flex:0 0 auto;}

  /* filters */
  .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
  .filters .select{flex:0 0 auto;width:auto;min-width:130px;}

  /* countdown */
  .countdown{display:flex;align-items:baseline;gap:10px;}
  .countdown .big{font-size:46px;font-weight:900;color:var(--orange);line-height:1;}
  .countdown .unit{font-size:15px;font-weight:700;color:var(--ink-soft);}
  .note{font-size:12.5px;color:var(--amber);background:#FCF3E2;border:1px solid #F6E4C0;border-radius:10px;padding:9px 12px;margin-top:10px;display:flex;gap:7px;align-items:flex-start;}
  .note svg{width:16px;height:16px;flex:0 0 16px;margin-top:1px;}

  /* structure card */
  .struct-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--border-2);}
  .struct-row:last-child{border-bottom:none;}
  .struct-row .s-name{font-weight:700;}
  .struct-row .s-pct{color:var(--orange);font-weight:800;}

  /* backup banner */
  .backup-banner{background:#FFF7E8;border:1px solid var(--orange-soft);border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:12px;margin-bottom:16px;}
  .backup-banner svg{width:22px;height:22px;color:var(--orange);flex:0 0 22px;}

  .empty{text-align:center;color:var(--ink-soft);padding:30px 10px;font-size:14px;}
  .muted{color:var(--ink-soft);font-size:13px;}
  .spacer{flex:1;}

  /* ===== Focus overlay ===== */
  .focus{position:fixed;inset:0;background:linear-gradient(160deg,#FFF8EF,#FDEBD6);z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
  .focus.show{display:flex;}
  .focus-top{position:absolute;top:18px;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:0 22px;}
  .focus-progress{font-weight:800;font-size:16px;color:var(--ink);}
  .focus-card{width:min(560px,92vw);background:var(--surface);border-radius:24px;box-shadow:var(--shadow);padding:34px 30px;text-align:center;position:relative;min-height:300px;display:flex;flex-direction:column;justify-content:center;}
  .fc-word{font-size:44px;font-weight:900;color:var(--ink);letter-spacing:.5px;}
  .fc-ph{font-size:21px;color:var(--ink-soft);margin-top:8px;}
  .fc-speak{margin-top:14px;display:inline-flex;align-items:center;gap:7px;background:var(--surface-2);border:1px solid var(--border);border-radius:999px;padding:8px 15px;font-weight:700;font-size:13.5px;color:var(--ink);}
  .fc-speak svg{width:17px;height:17px;color:var(--orange);}
  .fc-divider{height:1px;background:var(--border-2);margin:22px 0;}
  .fc-back{font-size:19px;color:var(--ink);font-weight:700;line-height:1.5;}
  .fc-pos{display:inline-block;font-size:13px;font-weight:700;color:var(--orange);background:var(--orange-soft);border-radius:6px;padding:2px 8px;margin-bottom:10px;}
  .fc-mean{font-size:18px;color:var(--ink);margin-top:6px;}
  .fc-coll{font-size:14px;color:var(--ink-soft);margin-top:12px;font-style:italic;}
  .fc-actions{display:flex;gap:14px;margin-top:30px;}
  .fc-btn{flex:1;padding:16px;border-radius:16px;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px;}
  .fc-btn svg{width:20px;height:20px;}
  .fc-known{background:var(--green);color:#fff;}
  .fc-unknown{background:#FFF0EC;color:var(--red);border:1.5px solid #F3C4B8;}
  .fc-kind{position:absolute;top:14px;left:16px;font-size:12px;font-weight:700;color:var(--ink-soft);}
  .fc-kind.review{color:var(--orange);}

  #confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
  #confetti i{position:absolute;top:-12px;width:10px;height:14px;border-radius:2px;animation:fall 1.8s linear forwards;}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:0;}}
  .focus-done{text-align:center;}
  .focus-done .fd-emoji{font-size:0;}
  .focus-done h2{font-size:28px;margin:0 0 8px;color:var(--green);}
  .focus-done p{color:var(--ink-soft);margin:0 0 20px;}

  /* ===== Responsive ===== */
  /* tablet */
  @media (max-width:1024px){
    .sidebar{display:none;}
    .topnav{display:flex;position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);padding:10px 14px;gap:6px;overflow-x:auto;}
    .topnav .nav-item{flex:0 0 auto;padding:9px 14px;}
    .topnav .brand{display:none;}
    .content{padding:18px 18px 36px;}
  }
  /* phone */
  @media (max-width:768px){
    .topnav{display:none;}
    .bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom));}
    .bottom-nav .nav-item{flex:1;flex-direction:column;gap:3px;padding:7px 4px;font-size:11.5px;border-radius:10px;}
    .bottom-nav .nav-item svg{width:22px;height:22px;}
    .content{padding:16px 14px 92px;}
    .g2,.g3,.g4{grid-template-columns:1fr;}
    .grid.g2,.grid.g3,.grid.g4{grid-template-columns:1fr;}
    .heatmap{grid-template-columns:repeat(10,1fr);}
    .page-title{font-size:20px;}
    .fc-word{font-size:36px;}
    .fc-actions{flex-direction:column;}
  }
  @media (max-width:380px){
    .handle{flex-direction:column;align-items:stretch;}
  }
</style>
</head>
<body>
<div class="app">
  <!-- Sidebar (desktop) -->
  <aside class="sidebar">
    <div class="brand"><span class="logo" id="brandLogo"></span><span>四六级备考台</span></div>
    <nav class="side-nav" id="sideNav"></nav>
    <div class="side-foot">纯本地 · 离线可用 · 数据存于本机</div>
  </aside>

  <!-- Top nav (tablet) -->
  <nav class="topnav" id="topNav"></nav>

  <div class="main">
    <div class="content" id="content"></div>
  </div>

  <!-- Bottom nav (phone) -->
  <nav class="bottom-nav" id="bottomNav"></nav>
</div>

<!-- Focus overlay -->
<div class="focus" id="focus">
  <div id="confetti"></div>
  <div class="focus-top">
    <div class="focus-progress" id="focusProgress"></div>
    <button class="btn btn-ghost btn-sm" id="focusClose">退出</button>
  </div>
  <div class="focus-card" id="focusCard"></div>
</div>

<script>
"use strict";
/* ===================== 内置四级高频词库 ===================== */

const MASTER = [
["abandon","/əˈbændən/","v.","抛弃，放弃","abandon oneself to 沉溺于"],
["abroad","/əˈbrɔːd/","ad.","在国外，到国外","go abroad 出国"],
["absent","/ˈæbsənt/","a.","缺席的，不在的","be absent from 缺席"],

["approve","/əˈpruːv/","v.","批准，同意","approve of 赞成"],

["aspect","/ˈæspekt/","n.","方面","in this aspect 在这方面"],

["attain","/əˈteɪn/","v.","达到，获得","attain a goal 达到目标"],

["attract","/əˈtrækt/","v.","吸引","attract attention 吸引注意"],
["available","/əˈveɪləbl/","a.","可用的，可得到的","be available for 可用于"],
["average","/ˈævərɪdʒ/","a./n.","平均的；平均数","on average 平均"],
["avoid","/əˈvɔɪd/","v.","避免","avoid doing 避免做"],
["aware","/əˈweə/","a.","意识到的","be aware of 意识到"],
["bargain","/ˈbɑːɡɪn/","n./v.","便宜货；讨价还价","bargain with 与…讨价"],

function load(){
  try{ const r = localStorage.getItem(KEY); if(r) return JSON.parse(r); }catch(e){}
  return defaults();
}
function save(){ localStorage.setItem(KEY, JSON.stringify(S)); }
function defaults(){
  const y = new Date().getFullYear();
  return { newPerDay:10, examDate: thirdSatOfNov(y), words:{}, practice:[], mistakes:[], checkins:{}, linkedGoal:null, dayMark:null, dayPlan:0 };
}
function uid(){ return Math.random().toString(36).slice(2,9); }

/* ===================== 日期工具 ===================== */
function fmt(d){ const y=d.getFullYear(); const m=String(d.getMonth()+1).padStart(2,"0"); const day=String(d.getDate()).padStart(2,"0"); return y+"-"+m+"-"+day; }
function todayStr(){ return fmt(new Date()); }
function parse(s){ const p=s.split("-").map(Number); return new Date(p[0]||0,(p[1]||1)-1,p[2]||0); }
function addDays(s,n){ const d=parse(s); d.setDate(d.getDate()+n); return fmt(d); }
function diffDays(a,b){ return Math.round((parse(a)-parse(b))/86400000); }
function thirdSatOfNov(year){
  const sats=[];
  for(let i=1;i<=30;i++){ const x=new Date(year,10,i); if(x.getDay()===6) sats.push(i); }
  const d=sats[2]; return year+"-11-"+String(d).padStart(2,"0");
}

/* ===================== 单词状态 ===================== */
function wstate(w){
  if(!S.words[w]) S.words[w]={status:"new",level:0,due:null,firstIssued:null,wrongStreak:0,wrongStreakDate:null,weak:false,last:null};
  return S.words[w];
}

/* 构建今日队列：新词(可改数量)+到期复习旧词。昨日未完成新词自动滚入（firstIssued<今日仍为new） */
function buildQueue(){
  const t=todayStr();
  const reviews=[], rolled=[], fresh=[];
  let newToday=0;
  for(const m of MASTER){
    const w=m[0]; const st=wstate(w);
    if(st.status==="new"){
      if(st.firstIssued && st.firstIssued<t) rolled.push(w);
      else if(st.firstIssued===t) newToday++;
      else fresh.push(w);
    } else if(st.status==="learning" && st.due && st.due<=t){
      reviews.push(w);
    }
  }
  const quota=Math.max(0, S.newPerDay-newToday);
  const take=fresh.slice(0,quota);
  take.forEach(w=>{ wstate(w).firstIssued=t; });
  const q=[];
  take.forEach(w=>q.push({w:w,kind:"new"}));
  rolled.forEach(w=>q.push({w:w,kind:"new"}));
  reviews.forEach(w=>q.push({w:w,kind:"review"}));
  return q;
}

/* ===================== 打卡 / 连续天数 / 热力 ===================== */
function addCheckin(date,kind){ if(!S.checkins[date]) S.checkins[date]={words:0,practice:0}; S.checkins[date][kind]++; }
function todayReviewed(){ const c=S.checkins[todayStr()]; return c?c.words:0; }
function streak(){
  let n=0; let d=todayStr();
  while(S.checkins[d] && S.checkins[d].words>0){ n++; d=addDays(d,-1); }
  return n;
}

/* ===================== 背词复习逻辑 ===================== */
function reviewWord(w, known){
  const st=wstate(w); const t=todayStr();
  st.last=t;
  addCheckin(t,"words");
  if(st.status==="new"){
    if(known){ st.status="learning"; st.level=0; st.due=addDays(t,SRS[0]); }
    else handleWrong(st,w);
  } else { // learning
    if(known){
      st.level++;
      if(st.level>=SRS.length){ st.status="graduated"; st.due=null; st.weak=false; }
      else st.due=addDays(t,SRS[st.level]);
    } else handleWrong(st,w);
  }
  save();
}
function handleWrong(st,w){
  const t=todayStr();
  if(st.wrongStreakDate===t) st.wrongStreak++; else { st.wrongStreak=1; st.wrongStreakDate=t; }
  st.weak=true;
  if(st.wrongStreak>=3){ st.due=addDays(t,1); }   // 当天连续3次不认识→改到明天
  else { queueArr.push({w:w,kind: st.status==="new"?"new":"review"}); } // 回今日队尾
}

/* ===================== 发音（系统朗读） ===================== */
const CAN_SPEAK = ("speechSynthesis" in window);
function speak(word){
  if(!CAN_SPEAK) return;
  try{
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(word);
    u.lang="en-US"; u.rate=0.92;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function weakWords(){ return MASTER.map(m=>m[0]).filter(w=>{ const st=wstate(w); return st.weak && st.status!=="graduated"; }); }

function ringSvg(pct){
  const R=52, C=2*Math.PI*R, off=C*(1-pct/100);
  return `<svg class="ring" viewBox="0 0 120 120">
    <circle class="ring-bg" cx="60" cy="60" r="${R}"></circle>
    <circle class="ring-fg" cx="60" cy="60" r="${R}" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 60 60)"></circle>
    <text x="60" y="58" text-anchor="middle" class="ring-center" fill="var(--ink)">${pct}%</text>
    <text x="60" y="76" text-anchor="middle" fill="var(--ink-soft)" style="font-size:11px;">完成度</text>
  </svg>`;
}
function heatmapHtml(){
  const t=todayStr(); let cells="";
  for(let i=29;i>=0;i--){
    const d=addDays(t,-i); const c=S.checkins[d]; const n=c?c.words:0;
    const lvl=n===0?0:n<=2?1:n<=5?2:n<=9?3:4;
    cells+=`<div class="hm-cell lvl${lvl}" title="${d}：背词 ${n} 个"></div>`;
  }
  return `<div class="heatmap">${cells}</div>`;
}
function lineChart14(){
  const t=todayStr(); const days=[];
  for(let i=13;i>=0;i--){
    const d=addDays(t,-i);
    const ps=S.practice.filter(p=>p.date===d);
    let rate=null;
    if(ps.length){ const tot=ps.reduce((s,p)=>s+p.total,0), cor=ps.reduce((s,p)=>s+p.correct,0); rate=tot?Math.round(cor/tot*100):0; }
    days.push({date:d,rate:rate});
  }
  const W=680,H=210,padL=38,padR=14,padT=16,padB=28;
  const xstep=(W-padL-padR)/(days.length-1);
  const yMax=100, yMin=0;
  const y=v=>padT+(1-(v-yMin)/(yMax-yMin))*(H-padT-padB);
  const x=i=>padL+i*xstep;
  let pts="",dots="",labels="";
  days.forEach((d,i)=>{
    if(d.rate!==null){ pts+=`${x(i).toFixed(1)},${y(d.rate).toFixed(1)} `; dots+=`<circle cx="${x(i).toFixed(1)}" cy="${y(d.rate).toFixed(1)}" r="3.5" fill="var(--orange)"></circle>`; }
    if(i%2===0||i===days.length-1){ labels+=`<text x="${x(i).toFixed(1)}" y="${H-8}" text-anchor="middle" fill="var(--ink-soft)" style="font-size:10px;">${d.date.slice(5)}</text>`; }
  });
  // gridlines
  let grid="";
  [0,25,50,75,100].forEach(g=>{ grid+=`<line x1="${padL}" y1="${y(g).toFixed(1)}" x2="${W-padR}" y2="${y(g).toFixed(1)}" stroke="var(--border-2)" stroke-width="1"></line><text x="${padL-6}" y="${(y(g)+3).toFixed(1)}" text-anchor="end" fill="var(--ink-soft)" style="font-size:10px;">${g}</text>`; });
  const poly=pts.trim()?`<polyline points="${pts.trim()}" fill="none" stroke="var(--orange)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></polyline>`:"";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${grid}${poly}${dots}${labels}</svg>`;
}
function backupBanner(){
  return `<div class="backup-banner">${ICON.warn}<div>已累计 <b>${totalRecords()}</b> 条记录，建议导出 JSON 备份（「我的」→ 导出）。</div></div>`;

/* ===================== 事件绑定 ===================== */
function bindView(){
  const c=$("#content");
  c.querySelectorAll("[data-act]").forEach(el=>{
    if(el.tagName==="SELECT"){ el.addEventListener("change",onAct); }
    else el.addEventListener("click",onAct);
  });
  const ci=$("#clearInput");
  if(ci){ ci.addEventListener("input",()=>{ $("#clearBtn").disabled = ci.value.trim()!=="清空"; }); }
  const imp=$("#importFile");
  if(imp && !imp.dataset.bound){ imp.dataset.bound="1"; imp.addEventListener("change",handleImportFile); }
}
function onAct(e){
  const el=e.currentTarget; const act=el.dataset.act; const v=el.dataset.v; const id=el.dataset.id; const w=el.dataset.w;
  if(act==="startFocus"){ startFocus(); }
  else if(act==="goto"){ setView(v); }
  else if(act==="png"){ downloadPng(); }
  else if(act==="addPractice"){
    const type=$("#pfType").value; const total=parseInt($("#pfTotal").value,10); const correct=parseInt($("#pfCorrect").value,10);
    if(isNaN(total)||isNaN(correct)||total<0||correct<0||correct>total){ alert("请填写有效做题数与正确数（正确数不超过做题数）。"); return; }
    S.practice.push({id:uid(),date:todayStr(),type:type,total:total,correct:correct,sample:false});
    addCheckin(todayStr(),"practice"); save(); render();
  }
  else if(act==="delPractice"){ S.practice=S.practice.filter(p=>p.id!==id); save(); render(); }
  else if(act==="addMistake"){
    const type=$("#mType").value; const reason=$("#mReason").value.trim(); const approach=$("#mApproach").value.trim();
    if(!reason||!approach){ alert("请填写错因与正确思路。"); return; }
    S.mistakes.push({id:uid(),date:todayStr(),type:type,reason:reason,approach:approach,level:0,due:todayStr(),removed:false,sample:false});
    save(); render();
  }
  else if(act==="masterMistake"){
    const m=S.mistakes.find(x=>x.id===id); if(!m) return;
    m.level++; if(m.level>=MIS.length){ m.removed=true; } else { m.due=addDays(todayStr(),MIS[m.level]); }
    save(); render();
  }
  else if(act==="delMistake"){ S.mistakes=S.mistakes.filter(x=>x.id!==id); save(); render(); }
  else if(act==="reviewWeak"){
    const st=wstate(w); st.weak=false; if(st.status==="new"){ st.status="learning"; st.level=0; st.due=addDays(todayStr(),SRS[0]); } save(); render();
  }
  else if(act==="removeWeak"){ wstate(w).weak=false; save(); render(); }
  else if(act==="filter"){ if(el.id==="filterType") filterType=el.value; else filterReason=el.value; render(); }
  else if(act==="export"){ exportJson(); }
  else if(act==="import"){ $("#importFile").click(); }
  else if(act==="clearSamples"){ clearSamples(); }
  else if(act==="clearAll"){ clearAll(); }
  else if(act==="linkGoal"){ linkGoal(); }
}
function handleImportFile(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ const data=JSON.parse(r.result); if(confirm("导入将覆盖当前全部数据，确定继续？")){ S=Object.assign(defaults(),data); save(); render(); alert("导入成功。"); } }catch(err){ alert("文件解析失败，请确认是有效的备份 JSON。"); } };
  r.readAsText(f);
  e.target.value="";
}

let queueArr=[], current=null;
function startFocus(){

function closeFocus(){ $("#focus").classList.remove("show"); current=null; render(); }

function nextCard(){
  if(queueArr.length===0){ finishFocus(); return; }
  current=queueArr.shift();
  const m=MASTER.find(x=>x[0]===current.w);
  const flipped=$("#focusCard").dataset.flipped==="1";
  renderCard(m,false);
  updateProgress();
}
function renderCard(m,flipped){
  const card=$("#focusCard");
  card.dataset.flipped=flipped?"1":"0";
  const speakBtn = CAN_SPEAK? `<button class="fc-speak" id="fcSpeak">${ICON.speaker}朗读</button>`:"";
  if(!flipped){
    card.innerHTML=`
      <div class="fc-kind ${current.kind==="review"?"review":""}">${current.kind==="review"?"复习":"新词"}</div>
      <div class="fc-word">${esc(m[0])}</div>
      <div class="fc-ph">${esc(m[1])}</div>
      ${speakBtn}
      <div class="fc-divider"></div>
      <button class="btn btn-primary btn-block" id="fcFlip">${ICON.book}翻面看释义</button>
    `;
    const flip=$("#fcFlip"); if(flip) flip.addEventListener("click",()=>renderCard(m,true));
    const sp=$("#fcSpeak"); if(sp) sp.addEventListener("click",()=>speak(m[0]));
  } else {
    card.innerHTML=`
      <div class="fc-kind ${current.kind==="review"?"review":""}">${current.kind==="review"?"复习":"新词"}</div>
      <div class="fc-word">${esc(m[0])}</div>
      <div class="fc-ph">${esc(m[1])}</div>
      <div class="fc-divider"></div>
      <div class="fc-pos">${esc(m[2])}</div>
      <div class="fc-back">${esc(m[3])}</div>
      <div class="fc-coll">常考：${esc(m[4])}</div>
      <div class="fc-actions">
        <button class="fc-btn fc-unknown" id="fcUnk">${ICON.cross}不认识</button>
        <button class="fc-btn fc-known" id="fcKn">${ICON.check}认识</button>
      </div>
    `;
    $("#fcKn").addEventListener("click",()=>{ reviewWord(current.w,true); afterReview(); });
    $("#fcUnk").addEventListener("click",()=>{ reviewWord(current.w,false); afterReview(); });
  }
}
function afterReview(){
  // 不认识回队尾由 reviewWord 内部处理（push 到 queueArr）；无论哪种都取下一个
  updateProgress();
  // 若队列空（或仅剩刚回队的——nextCard 会继续处理）则进入下一卡
  if(queueArr.length===0){ finishFocus(); }
  else nextCard();
}
function updateProgress(){
  const done=todayReviewed();
  const total=Math.max(done+queueArr.length,1);
  $("#focusProgress").textContent=`${done} / ${total}`;
}
function finishFocus(){
  const card=$("#focusCard");
  card.dataset.flipped="0";
  card.innerHTML=`
    <div class="focus-done">
      <h2>${ICON.check} 今日背词完成！</h2>
      <p>连续背词 ${streak()} 天 · 今日共背 ${todayReviewed()} 个</p>
      <button class="btn btn-primary" id="fcDone">${ICON.home}返回</button>
    </div>`;
  celebrate();
  $("#fcDone").addEventListener("click",closeFocus);
  updateProgress();
}
function celebrate(){
  if(!current) return;
  const fc=$("#confetti"); fc.innerHTML="";
  const cols=["#F0922B","#FFB877","#2E9E5B","#22304E","#E0492F"];
  for(let i=0;i<46;i++){
    const s=document.createElement("i");
    s.style.left=(Math.random()*100)+"%";
    s.style.background=cols[i%cols.length];
    s.style.animationDelay=(Math.random()*0.5)+"s";
    s.style.transform="rotate("+(Math.random()*360)+"deg)";
    fc.appendChild(s);
  }
  setTimeout(()=>{ fc.innerHTML=""; },2200);
}

function overallRate(){
  if(!S.practice.length) return 0;
  const tot=S.practice.reduce((s,p)=>s+p.total,0), cor=S.practice.reduce((s,p)=>s+p.correct,0);
  return tot?Math.round(cor/tot*100):0;
}
function roundRect(x,X,Y,W,H,r){ x.beginPath(); x.moveTo(X+r,Y); x.arcTo(X+W,Y,X+W,Y+H,r); x.arcTo(X+W,Y+H,X,Y+H,r); x.arcTo(X,Y+H,X,Y,r); x.arcTo(X,Y,X+W,Y,r); x.closePath(); }

/* ===================== 示例数据 ===================== */
function loadSamples(){
  if(localStorage.getItem(SAMPLES)) return;
  const t=todayStr();
  const pdefs=[["listening",20,15],["reading",30,22],["writing",15,11],["translate",10,7],["listening",25,18],["reading",30,20]];
  pdefs.forEach((d,i)=>{ S.practice.push({id:uid(),date:addDays(t,-(i+1)),type:d[0],total:d[1],correct:d[2],sample:true}); });
  for(let i=0;i<12;i++){ const dt=addDays(t,-i); S.checkins[dt]={words:i<9?(3+(i%4)):0,practice:1}; }
  ["achieve","acquire","adapt","adequate","adjust"].forEach((w,i)=>{ const st=wstate(w); st.status="learning"; st.level=i%3; st.due=addDays(t,-(i%2)); st.firstIssued=addDays(t,-(5+i)); st.last=addDays(t,-(i%2)); });
  ["abandon","absent","absorb"].forEach(w=>{ const st=wstate(w); st.status="learning"; st.level=0; st.due=addDays(t,-1); st.firstIssued=addDays(t,-3); st.weak=true; });
  const mdefs=[["listening","没抓住关键词","先预读选项再听",addDays(t,-1)],["reading","长难句理解偏差","拆分句子结构",addDays(t,2)],["writing","词汇匮乏","背诵高分句型",addDays(t,-3)]];
  mdefs.forEach((m,i)=>{ S.mistakes.push({id:uid(),date:addDays(t,-(i+1)),type:m[0],reason:m[1],approach:m[2],level:i%2,due:m[3],removed:false,sample:true}); });
  localStorage.setItem(SAMPLES,"1"); save();
}

/* ===================== 启动 ===================== */
function ensureDay(){
  const t=todayStr();
  if(S.dayMark!==t){ S.dayMark=t; S.dayPlan=buildQueue().length; save(); }
}
function init(){
  loadSamples();
  ensureDay();
  $("#brandLogo").innerHTML=ICON.book;
  buildNav();
  setView("today");
}
init();
</script>
